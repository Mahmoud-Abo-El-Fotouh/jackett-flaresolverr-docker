services:



  jackett:

    build: ./jackett
    image: mahmoudaboelfotouh/alpine-jackett:v1.0
    container_name: jackett_app

    environment:
        - JACKETT_VERSION=latest
        - TZ=UTC

    volumes:
        - Jackett_App:/app
        - Jackett_Config:/config

    restart: unless-stopped


  flaresolverr:

    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr_service

    environment:
        - LOG_LEVEL=info
        - PORT=8191
        - TZ=UTC

    restart: unless-stopped


  nginx:

    image: nginx:alpine
    container_name: nginx_proxy

    ports:
        - "8080:80"

    volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
        - jackett


volumes:
  Jackett_App:
  Jackett_Config:
